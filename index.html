<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">YouTube</div>

        <div class="search-bar">
            <input type="text" placeholder="Search">
            <button>🔍</button>
        </div>

        <div class="icons">
            <span>🔔</span>
            <span>👤</span>
        </div>
    </header>

    <!-- MAIN -->
    <div class="container">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <p>🏠 Home</p>
            <p>🎬 Shorts</p>
            <p>📺 Subscriptions</p>
            <p>📚 Library</p>
        </aside>

        <!-- CONTENT -->
        <main class="content">

            <!-- CATEGORY -->
            <div class="categories">
                <button>All</button>
                <button>Music</button>
                <button>Gaming</button>
                <button>News</button>
            </div>

            <!-- VIDEO GRID -->
            <div class="video-grid">

                <div class="video-card">
                    <img src="https://via.placeholder.com/300x180">
                    <h4>Video Title</h4>
                    <p>Channel Name</p>
                </div>

                <div class="video-card">
                    <img src="https://via.placeholder.com/300x180">
                    <h4>Another Video</h4>
                    <p>Channel Name</p>
                </div>

            </div>

        </main>
    </div>

</body>
</html>
